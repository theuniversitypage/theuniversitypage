<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allahabad University Page | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101522;--muted:#6c7484;--line:#e7e9ef;--bg:#f6f7fb;--card:#fff;--accent:#315cff;--accent2:#7048ff;--soft:#eef2ff;--danger:#d92d20;--success:#12b76a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Anek Devanagari",sans-serif}
.page{min-height:100vh;padding:28px 16px;display:flex;flex-direction:column;align-items:center}

/* Dashboard Styles */
.dashboard-shell{width:min(1240px,100%);background:var(--card);border:1px solid #e5e7ee;border-radius:30px;padding:30px;box-shadow:0 30px 90px rgba(20,28,55,.12);margin-top:20px}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:15px}
.dash-header h2{margin:0;font-size:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--soft);border:1px solid #d8e1ff;padding:20px;border-radius:18px;display:flex;flex-direction:column;gap:5px}
.stat-card span{color:var(--muted);font-size:13px;font-weight:700}
.stat-card h3{margin:0;font-size:28px;color:var(--accent)}
.dash-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.dash-actions input, .dash-actions select{flex:1;min-width:200px;height:44px;border:1px solid #dfe2e9;border-radius:12px;padding:0 14px;font:500 14px "Bricolage Grotesque","Anek Devanagari",sans-serif;outline:0;background:#fff;color:var(--ink)}
.dash-actions input:focus, .dash-actions select:focus{border-color:#8da2ff;box-shadow:0 0 0 4px #eef2ff}
.btn{padding:0 18px;height:44px;border-radius:12px;border:none;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13px;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:#111827;color:#fff}
.table-container{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th, td{padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f9fafc;font-weight:800;color:var(--muted)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);place-items:center;z-index:1000;padding:16px}
.modal-content{background:#fff;width:min(500px,100%);padding:30px;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,0.2);position:relative;animation:floatIn .3s ease}
.modal-close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:20px;cursor:pointer}
.modal-content h3{margin-top:0;margin-bottom:15px;font-size:20px}
.detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.detail-row span:first-child{color:var(--muted);font-weight:700}

.footer{text-align:center;padding:20px;color:#8a919f;font-size:11px}
@keyframes floatIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="page">

<!-- Admin Dashboard Shell -->
<section class="dashboard-shell">
<div class="dash-header">
  <h2>🎓 Admin Dashboard & Registrations</h2>
  <div style="display:flex; gap:10px;">
    <button class="btn btn-primary" onclick="exportCSV()">📥 Export CSV</button>
    <button class="btn btn-secondary" onclick="exportPDF()">📄 Export PDF</button>
  </div>
</div>

<!-- Stats Cards -->
<div class="stats-grid">
  <div class="stat-card"><span>Total Registrations</span><h3 id="statTotal">0</h3></div>
  <div class="stat-card"><span>Male Students</span><h3 id="statMale">0</h3></div>
  <div class="stat-card"><span>Female Students</span><h3 id="statFemale">0</h3></div>
  <div class="stat-card"><span>Today's Entries</span><h3 id="statToday">0</h3></div>
</div>

<!-- Search & Filters -->
<div class="dash-actions">
  <input type="text" id="searchInput" placeholder="Search by name, whatsapp..." onkeyup="filterTable()">
  <select id="filterGender" onchange="filterTable()">
    <option value="">All Genders</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>
  <select id="filterCourse" onchange="filterTable()">
    <option value="">All Courses</option>
    <option value="B.A.">B.A.</option>
    <option value="B.Sc.">B.Sc.</option>
    <option value="B.Com.">B.Com.</option>
    <option value="LL.B.">LL.B.</option>
  </select>
</div>

<!-- Table -->
<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Full Name</th>
        <th>WhatsApp</th>
        <th>Gender</th>
        <th>College / Campus</th>
        <th>Course</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Data rows will be injected dynamically -->
    </tbody>
  </table>
</div>
</section>

<div class="footer">© 2026 Allahabad University Page • Student Community</div>
</div>

<!-- Student Detail Modal -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>Student Details</h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Firebase SDK Integration -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD837pmW5N21lMgeVlpgWPx0FaMisSnxwU",
    authDomain: "theuniversitypage-cc4a7.firebaseapp.com",
    databaseURL: "https://theuniversitypage-cc4a7-default-rtdb.firebaseio.com",
    projectId: "theuniversitypage-cc4a7",
    storageBucket: "theuniversitypage-cc4a7.firebasestorage.app",
    messagingSenderId: "31910615607",
    appId: "1:31910615607:web:bee5bd81c8118a16d1bdb2",
    measurementId: "G-6E55FCSXDP"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.allStudents = [];

  // Fetch Data from Firebase Realtime Database
  const registrationsRef = ref(db, 'registrations');
  onValue(registrationsRef, (snapshot) => {
    const data = snapshot.val();
    window.allStudents = [];
    if (data) {
      Object.keys(data).forEach(key => {
        window.allStudents.push({ id: key, ...data[key] });
      });
    }
    window.allStudents.reverse();
    updateDashboard(window.allStudents);
  });
</script>

<script>
function updateDashboard(students) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  let total = students.length;
  let male = 0;
  let female = 0;
  let todayCount = 0;
  const todayStr = new Date().toLocaleDateString();

  if(total === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:30px;">No registrations found yet.</td></tr>`;
  }

  students.forEach((s) => {
    if(s.gender === "Male") male++;
    if(s.gender === "Female") female++;
    if(s.dateFormatted === todayStr) todayCount++;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.dateFormatted || 'N/A'}</td>
      <td><strong>${s.name}</strong></td>
      <td>${s.whatsapp}</td>
      <td>${s.gender}</td>
      <td>${s.college}</td>
      <td>${s.course}</td>
      <td><button class="btn btn-primary" style="height:32px; padding:0 12px;" onclick="viewDetails('${s.id}')">View</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statMale").textContent = male;
  document.getElementById("statFemale").textContent = female;
  document.getElementById("statToday").textContent = todayCount;
}

function filterTable() {
  const searchTxt = document.getElementById("searchInput").value.toLowerCase();
  const genderFilter = document.getElementById("filterGender").value;
  const courseFilter = document.getElementById("filterCourse").value;

  const filtered = window.allStudents.filter(s => {
    const matchesSearch = s.name.toLowerCase().includes(searchTxt) || s.whatsapp.includes(searchTxt);
    const matchesGender = genderFilter ? s.gender === genderFilter : true;
    const matchesCourse = courseFilter ? s.course.includes(courseFilter) : true;
    return matchesSearch && matchesGender && matchesCourse;
  });

  updateDashboardFiltered(filtered);
}

function updateDashboardFiltered(students) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  if(students.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:30px;">No matching records found.</td></tr>`;
    return;
  }
  students.forEach(s => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.dateFormatted || 'N/A'}</td>
      <td><strong>${s.name}</strong></td>
      <td>${s.whatsapp}</td>
      <td>${s.gender}</td>
      <td>${s.college}</td>
      <td>${s.course}</td>
      <td><button class="btn btn-primary" style="height:32px; padding:0 12px;" onclick="viewDetails('${s.id}')">View</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function viewDetails(id) {
  const student = window.allStudents.find(s => s.id === id);
  if(!student) return;

  const modalBody = document.getElementById("modalBody");
  modalBody.innerHTML = `
    <div class="detail-row"><span>Full Name</span><span>${student.name}</span></div>
    <div class="detail-row"><span>WhatsApp</span><span>${student.whatsapp}</span></div>
    <div class="detail-row"><span>Gender</span><span>${student.gender}</span></div>
    <div class="detail-row"><span>College / Campus</span><span>${student.college}</span></div>
    <div class="detail-row"><span>Course</span><span>${student.course}</span></div>
    <div class="detail-row"><span>Interest / Purpose</span><span>${student.interest || 'N/A'}</span></div>
    <div class="detail-row"><span>Registration Date</span><span>${student.dateFormatted || 'N/A'}</span></div>
  `;
  document.getElementById("detailModal").style.display = "grid";
}

function closeModal() {
  document.getElementById("detailModal").style.display = "none";
}

function exportCSV() {
  if(!window.allStudents.length) { alert("No data to export!"); return; }
  let csvContent = "data:text/csv;charset=utf-8,Name,WhatsApp,Gender,College,Course,Interest,Date\n";
  window.allStudents.forEach(s => {
    csvContent += `"${s.name}","${s.whatsapp}","${s.gender}","${s.college}","${s.course}","${s.interest || ''}","${s.dateFormatted || ''}"\n`;
  });
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "AU_Student_Registrations.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function exportPDF() {
  if(!window.allStudents.length) { alert("No data to export!"); return; }
  window.print();
}
</script>
</body>
</html>
