<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="L8MTwwklD18hw-rbjRWfTjzMJD20u5BLAlTN1Zobp_U">
    <title>The University Page | Next-Gen University Entrance & Counseling Suite</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            /* 🌌 FIXED VISIBLE NAVY-DARK TOKENS (NO PURE BLACK) */
            --bg-base: #111827 !important;
            --bg-surface: #1F2937 !important;
            --bg-surface-hover: #374151 !important;
            --bg-card: #1E293B !important;
            --bg-chip: rgba(255, 255, 255, 0.08);
            --text-primary: #F9FAFB !important;
            --text-secondary: #E2E8F0 !important;
            --text-muted: #94A3B8 !important;
            --border: rgba(255, 255, 255, 0.15);
            --border-hover: rgba(99, 102, 241, 0.6);
            
            /* Accent & Gradients */
            --primary: #6366F1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --secondary: #EC4899;
            --accent-cyan: #06B6D4;
            --accent-green: #10B981;
            --gradient-primary: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
            --gradient-yt: linear-gradient(135deg, #FF0000 0%, #E11D48 100%);
            --shadow-glow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 26px;
            --blur: blur(20px);
        }

        [data-theme="light"] {
            /* ☀️ ULTRA CLEAN LIGHT TOKENS */
            --bg-base: #F4F6FC !important;
            --bg-surface: #FFFFFF !important;
            --bg-surface-hover: #F8FAFC !important;
            --bg-card: #FFFFFF !important;
            --bg-chip: rgba(15, 23, 42, 0.05);
            --text-primary: #0F172A !important;
            --text-secondary: #334155 !important;
            --text-muted: #64748B !important;
            --border: rgba(15, 23, 42, 0.1) !important;
            --border-hover: rgba(99, 102, 241, 0.5);
            --primary: #4F46E5;
            --primary-glow: rgba(79, 70, 229, 0.2);
            --shadow-glow: 0 20px 40px -15px rgba(79, 70, 229, 0.12);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        .ambient-glow {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 900px;
            height: 450px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(236, 72, 153, 0.06) 50%, transparent 80%);
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
        }

        h1, h2, h3, h4 {
            font-family: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.02em;
        }

        /* 💎 TOP NAVBAR */
        .header-wrapper {
            position: sticky;
            top: 0;
            z-index: 90;
            background: var(--bg-surface);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            max-width: 1280px;
            margin: 0 auto;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            min-width: 0;
        }

        .logo-badge {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: var(--radius-md);
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
            font-size: 1.15rem;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .logo-text h2 {
            font-size: 1.05rem;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-text span {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 📱 SLIDE-IN SIDEBAR DRAWER */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 300px;
            max-width: 85vw;
            background: var(--bg-surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid var(--border);
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.4);
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-drawer.active {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .drawer-header h3 {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .drawer-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-chip);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .drawer-links { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .drawer-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .drawer-links a:hover, .drawer-links a.active {
            background: var(--bg-chip);
            color: var(--primary);
            transform: translateX(4px);
        }

        .drawer-links a i {
            width: 24px;
            font-size: 1.1rem;
            text-align: center;
        }

        /* 🏛️ MAIN CONTAINER */
        .main-container {
            flex: 1;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px 40px;
            position: relative;
            z-index: 1;
        }

        /* ⚡ LIVE HIGH-TECH TICKER */
        .ticker-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: var(--blur);
            box-shadow: var(--shadow-glow);
        }

        .ticker-pill {
            background: rgba(244, 63, 94, 0.15);
            color: #F43F5E;
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .pulse-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #F43F5E;
            box-shadow: 0 0 8px #F43F5E;
            animation: neonPulse 1.4s infinite;
        }

        @keyframes neonPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
        }

        .ticker-marquee {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-track {
            display: inline-block;
            animation: marqueeFlow 24s linear infinite;
            font-size: 0.84rem;
            font-weight: 700;
        }

        .ticker-track a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-right: 36px;
        }

        .ticker-track a:hover { color: var(--primary); }

        @keyframes marqueeFlow {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* 🚀 ACCELERATOR PORTAL CARDS */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-bottom: 30px;
        }

        .portal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: var(--blur);
            transition: all 0.25s ease;
        }

        .portal-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            background: var(--bg-surface-hover);
        }

        .portal-icon {
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: var(--radius-md);
            background: var(--bg-chip);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .portal-meta h3 { font-size: 0.98rem; font-weight: 800; margin-bottom: 2px; }
        .portal-meta p { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; }

        /* 📋 SECTION HEADER */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 36px 0 16px;
            gap: 12px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 900;
        }

        .title-icon {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 8px;
            background: var(--gradient-primary);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .view-all-link {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: transform 0.2s ease;
        }

        .view-all-link:hover {
            transform: translateX(4px);
        }

        /* 🔥 BULLETINS FEED */
        .bulletin-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .bulletin-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: var(--blur);
            transition: all 0.2s ease;
        }

        .bulletin-item:hover {
            border-color: var(--primary);
            background: var(--bg-surface-hover);
        }

        .bulletin-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .badge-tag {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }

        .tag-cuet { background: rgba(99, 102, 241, 0.15); color: #818CF8; border: 1px solid rgba(99, 102, 241, 0.3); }
        .tag-au { background: rgba(236, 72, 153, 0.15); color: #F472B6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .tag-job { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .bulletin-text {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .bulletin-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .bulletin-date {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .bulletin-arrow {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-chip);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        /* 🎛️ SMART UTILITIES SUITE */
        .suite-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 35px;
        }

        .suite-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 22px;
            backdrop-filter: var(--blur);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-glow);
        }

        .suite-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .suite-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 12px;
            background: var(--gradient-primary);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: 0.86rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-select:focus, .form-input:focus {
            border-color: var(--primary);
        }

        .glow-btn {
            background: var(--gradient-primary);
            color: #FFFFFF;
            border: none;
            padding: 13px 20px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            width: 100%;
            text-decoration: none;
            box-shadow: 0 6px 20px -4px rgba(99, 102, 241, 0.5);
        }

        .glow-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .predict-result {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: var(--text-primary);
            font-size: 0.84rem;
            font-weight: 800;
            text-align: center;
        }

        /* ⚡ QUICK NAVIGATION VAULT */
        .quicklinks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
            margin-bottom: 35px;
        }

        .quicklink-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: var(--blur);
            transition: all 0.25s ease;
        }

        .quicklink-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            background: var(--bg-surface-hover);
            box-shadow: 0 10px 24px -6px var(--primary-glow);
        }

        .quicklink-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .quicklink-icon-wrap {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: var(--radius-md);
            background: var(--bg-chip);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }

        .quicklink-info h4 {
            font-size: 0.95rem;
            font-weight: 800;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .quicklink-info p {
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quicklink-arrow {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-chip);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .quicklink-card:hover .quicklink-arrow {
            background: var(--primary);
            color: #FFF;
        }

        /* 📺 1. ULTRA-PREMIUM CHANNELS HUB */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: var(--blur);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--gradient-yt);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .channel-card:hover {
            transform: translateY(-4px);
            border-color: rgba(225, 29, 72, 0.4);
            background: var(--bg-surface-hover);
            box-shadow: 0 12px 30px -8px rgba(225, 29, 72, 0.25);
        }

        .channel-card:hover::before { opacity: 1; }

        .channel-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .channel-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 14px;
            background: rgba(225, 29, 72, 0.1);
            color: #FF0000;
            border: 1px solid rgba(225, 29, 72, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            transition: transform 0.3s ease;
        }

        .channel-card:hover .channel-icon {
            transform: scale(1.08) rotate(3deg);
            background: var(--gradient-yt);
            color: #FFF;
        }

        .channel-meta h4 {
            font-size: 0.98rem;
            font-weight: 800;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-meta h4 i.fa-circle-check {
            font-size: 0.8rem;
            color: #38BDF8;
        }

        .channel-meta p {
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 600;
            margin: 0;
        }

        .yt-badge-btn {
            background: var(--gradient-yt);
            color: #FFF;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .channel-card:hover .yt-badge-btn {
            transform: scale(1.04);
            box-shadow: 0 6px 18px rgba(225, 29, 72, 0.5);
        }

        /* ❓ 2. FAQ ACCORDION */
        .faq-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .faq-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
