<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TutorPage | Ajmal Mansoori</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F1F5F9; color: #0F172A; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- HEADER -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <span class="bg-indigo-50 text-indigo-600 font-extrabold text-xs px-3 py-1 rounded-full uppercase">Owner Control Panel</span>
                <h1 class="text-2xl font-black text-slate-900 mt-1">TutorPage Management</h1>
            </div>
            <button onclick="logoutAdmin()" class="bg-rose-50 text-rose-600 font-bold px-4 py-2 rounded-xl text-xs hover:bg-rose-100 transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
            </button>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase">Total Registered Teachers</span>
                <h3 id="statTotalTutors" class="text-3xl font-black text-slate-900 mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase">Approved & Live Tutors</span>
                <h3 id="statApprovedTutors" class="text-3xl font-black text-emerald-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase">Platform Status</span>
                <h3 class="text-3xl font-black text-indigo-600 mt-1">Active</h3>
            </div>
        </div>

        <!-- TUTORS TABLE -->
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
            <h3 class="text-lg font-black text-slate-900 mb-4"><i class="fa-solid fa-chalkboard-user text-indigo-600 mr-2"></i> Manage Registered Teachers</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-400 uppercase text-[11px] font-extrabold">
                        <tr>
                            <th class="p-3 rounded-l-xl">Teacher Name</th>
                            <th class="p-3">Qualification & Subject</th>
                            <th class="p-3">Area & Fee</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 rounded-r-xl text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTutorsTable" class="divide-y divide-slate-100 font-medium">
                        <tr><td colspan="5" class="p-4 text-center text-slate-400">Loading registered teachers...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD837pmW5N21lMgeVlpgWPx0FaMisSnxwU",
            authDomain: "theuniversitypage-cc4a7.firebaseapp.com",
            databaseURL: "https://theuniversitypage-cc4a7-default-rtdb.firebaseio.com",
            projectId: "theuniversitypage-cc4a7",
            storageBucket: "theuniversitypage-cc4a7.firebasestorage.app",
            messagingSenderId: "31910615607",
            appId: "1:31910615607:web:bee5bd81c8118a16d1bdb2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Security check
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                loadAllTeachers();
            }
        });

        // Fetch all teachers from Firestore
        async function loadAllTeachers() {
            try {
                const snapshot = await db.collection("admins").get();
                const tbody = document.getElementById('adminTutorsTable');
                tbody.innerHTML = '';

                let totalCount = 0;
                let approvedCount = 0;

                snapshot.forEach(doc => {
                    const t = doc.data();
                    const id = doc.id;
                    
                    // Skip if user is strictly owner/admin account if needed, or list everyone
                    totalCount++;
                    const isVerified = t.verified === true;
                    if(isVerified) approvedCount++;

                    const statusBadge = isVerified 
                        ? `<span class="bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full text-xs font-bold">Approved</span>` 
                        : `<span class="bg-amber-50 text-amber-600 px-2.5 py-1 rounded-full text-xs font-bold">Pending</span>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 font-bold text-slate-900 flex items-center space-x-3">
                                <img src="${t.photoUrl || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80'}" class="w-10 h-10 rounded-xl object-cover">
                                <div>${t.fullName || 'Unnamed'} <span class="block text-xs font-normal text-slate-400">${t.whatsappNumber || ''}</span></div>
                            </td>
                            <td class="p-3 text-slate-600">${t.qualification || 'N/A'}<br><span class="text-xs text-indigo-600 font-bold">${t.subjects || ''}</span></td>
                            <td class="p-3 text-slate-600">${t.district || 'Allahabad'}<br><span class="text-xs text-slate-400">₹${t.fee || '0'}/mo</span></td>
                            <td class="p-3">${statusBadge}</td>
                            <td class="p-3 text-right space-x-2">
                                <button onclick="toggleVerify('${id}', ${isVerified})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-bold transition">
                                    ${isVerified ? 'Unverify' : 'Approve'}
                                </button>
                                <button onclick="deleteTeacher('${id}')" class="text-rose-500 hover:text-rose-700 p-1.5 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('statTotalTutors').innerText = totalCount;
                document.getElementById('statApprovedTutors').innerText = approvedCount;

            } catch (error) {
                console.error("Error loading teachers:", error);
            }
        }

        async function toggleVerify(id, currentStatus) {
            try {
                await db.collection("admins").doc(id).update({ verified: !currentStatus });
                loadAllTeachers();
            } catch (error) {
                alert("Error updating status: " + error.message);
            }
        }

        async function deleteTeacher(id) {
            if(confirm("Are you sure you want to delete this profile?")) {
                try {
                    await db.collection("admins").doc(id).delete();
                    loadAllTeachers();
                } catch (error) {
                    alert("Error deleting: " + error.message);
                }
            }
        }

        function logoutAdmin() {
            auth.signOut().then(() => window.location.href = "login.html");
        }
    </script>
</body>
</html>
