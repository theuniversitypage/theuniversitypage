<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | TutorPage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- TOP NAVBAR -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 text-white p-2 rounded-xl text-sm font-black">TP</div>
            <span class="text-lg font-extrabold text-slate-900">Teacher Portal</span>
        </div>
        <button onclick="logoutTeacher()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-xl text-xs font-bold transition">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
        </button>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-grow">
        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl mb-8">
            <div class="flex items-center space-x-4 mb-6">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl font-black" id="teacherInitial">T</div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900" id="teacherName">Loading Name...</h1>
                    <p class="text-xs text-slate-500 font-semibold" id="teacherEmail">Loading Email...</p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-indigo-50/60 p-5 rounded-2xl border border-indigo-100">
                    <span class="text-xs text-indigo-600 font-extrabold uppercase">Total Students Connected</span>
                    <h3 id="studentCount" class="text-3xl font-black text-slate-900 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50/60 p-5 rounded-2xl border border-emerald-100">
                    <span class="text-xs text-emerald-600 font-extrabold uppercase">Profile Status</span>
                    <h3 class="text-3xl font-black text-emerald-700 mt-1">Active</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 font-medium">
        <p>©️ 2026 TutorPage. Teacher Member Portal.</p>
    </footer>

    <script>
        // 🔑 Firebase Config (अपनी असली config यहाँ डालें)
        const firebaseConfig = {
            apiKey: "AIzaSyD837pmW5N21lMgeVlpgWPx0FaMisSnxwU",
            authDomain: "theuniversitypage-cc4a7.firebaseapp.com",
            projectId: "theuniversitypage-cc4a7",
            storageBucket: "theuniversitypage-cc4a7.firebasestorage.app",
            messagingSenderId: "31910615607",
            appId: "1:31910615607:web:bee5bd81c8118a16d1bdb2"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                // UI update with logged in teacher details
                document.getElementById('teacherName').innerText = user.displayName || "Registered Teacher";
                document.getElementById('teacherEmail').innerText = user.email;
                document.getElementById('teacherInitial').innerText = (user.displayName || "T")[0].toUpperCase();
                
                // Fetch students connected count from Firestore (आप अपने डेटाबेस स्ट्रक्चर के अनुसार इसे बदल सकते हैं)
                try {
                    const doc = await db.collection("tutors").doc(user.uid).get();
                    if(doc.exists && doc.data().studentsCount) {
                        document.getElementById('studentCount').innerText = doc.data().studentsCount;
                    }
                } catch(e) {
                    console.log("No extra data found");
                }
            }
        });

        function logoutTeacher() {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        }
    </script>
</body>
</html>
