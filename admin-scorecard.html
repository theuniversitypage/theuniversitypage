<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorecard Admin Backend | The University Page</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg-base: #060913; --bg-surface: #0e1526; --bg-card: #121b33;
            --text-primary: #FFFFFF; --text-secondary: #CBD5E1; --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.12); --primary: #6366F1;
            --gradient-primary: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
            --radius-md: 12px; --radius-xl: 24px;
        }
        [data-theme="light"] {
            --bg-base: #F8FAFC; --bg-surface: #FFFFFF; --bg-card: #FFFFFF;
            --text-primary: #0F172A; --text-secondary: #334155; --text-muted: #64748B;
            --border: #E2E8F0; --primary: #4F46E5;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-base); color: var(--text-primary); min-height: 100vh; padding: 20px; }

        /* AUTH OVERLAY */
        .auth-overlay { position: fixed; inset: 0; background: var(--bg-base); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 36px 28px; max-width: 400px; width: 100%; text-align: center; }
        .auth-input { width: 100%; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); font-size: 1rem; margin: 18px 0 14px; text-align: center; letter-spacing: 2px; outline: none; font-weight: 700; }

        .container { max-width: 1000px; margin: 0 auto; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        
        .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 28px; margin-bottom: 30px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
        .input-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; }
        .input-control { width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); font-size: 0.9rem; font-weight: 600; outline: none; }
        
        .btn-main { background: var(--gradient-primary); color: #FFF; border: none; padding: 14px; border-radius: var(--radius-md); font-weight: 800; width: 100%; cursor: pointer; }
        
        .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--bg-surface); padding: 14px; font-size: 0.8rem; font-weight: 800; border-bottom: 1px solid var(--border); }
        td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 0.86rem; color: var(--text-secondary); font-weight: 600; }
        .btn-del { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- AUTH LOCK SCREEN -->
    <div class="auth-overlay" id="authScreen">
        <div class="auth-card">
            <h2>Scorecard Backend</h2>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Enter Master PIN (1009)</p>
            <form onsubmit="verifyPin(event)">
                <input type="password" id="pinInput" class="auth-input" placeholder="••••" required autofocus>
                <button type="submit" class="btn-main">Unlock Dashboard</button>
            </form>
            <p id="pinError" style="color:#EF4444; font-size:0.75rem; font-weight:700; margin-top:10px; display:none;">Invalid PIN</p>
        </div>
    </div>

    <div class="container">
        <div class="panel-header">
            <div>
                <h1>Scorecard Management Backend</h1>
                <p style="font-size:0.85rem; color:var(--text-muted);">Add or update student scores for `scor.html`</p>
            </div>
            <a href="scor.html" target="_blank" style="color:var(--primary); font-weight:700; text-decoration:none;"><i class="fas fa-external-link-alt"></i> Open Live Portal</a>
        </div>

        <!-- ADD SCORE FORM -->
        <div class="form-card">
            <h3 style="margin-bottom: 16px;">Add New Student Scorecard</h3>
            <form id="scoreForm" onsubmit="saveStudentScore(event)">
                <div class="grid-2">
                    <div>
                        <label class="input-label">Student Full Name *</label>
                        <input type="text" id="fullName" class="input-control" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div>
                        <label class="input-label">Roll Number / Registration ID *</label>
                        <input type="text" id="rollNumber" class="input-control" placeholder="e.g. AU2026100" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div>
                        <label class="input-label">University Name *</label>
                        <input type="text" id="universityName" class="input-control" value="University of Allahabad" required>
                    </div>
                    <div>
                        <label class="input-label">Target Course *</label>
                        <input type="text" id="targetCourse" class="input-control" value="B.A. (Hons)" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div>
                        <label class="input-label">Total Raw Score *</label>
                        <input type="number" id="rawScore" class="input-control" placeholder="e.g. 175" required>
                    </div>
                    <div>
                        <label class="input-label">Normalized Score *</label>
                        <input type="number" step="0.01" id="normalizedScore" class="input-control" placeholder="e.g. 182.5" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div>
                        <label class="input-label">Percentile *</label>
                        <input type="text" id="percentile" class="input-control" placeholder="e.g. 98.4" required>
                    </div>
                    <div>
                        <label class="input-label">Admission Status / Remarks *</label>
                        <input type="text" id="admissionStatus" class="input-control" value="High Chance for Main Campus Admission" required>
                    </div>
                </div>
                <button type="submit" id="saveBtn" class="btn-main" style="margin-top:10px;">Save Scorecard to Database</button>
            </form>
        </div>

        <!-- RECORDS TABLE -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Student Name</th>
                        <th>University</th>
                        <th>Normalized Score</th>
                        <th>Percentile</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="scoresTableBody">
                    <tr><td colspan="6" style="text-align:center; padding:30px; color:var(--text-muted);">Loading records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FIREBASE BACKEND LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD837pmW5N21lMgeVlpgWPx0FaMisSnxwU",
            authDomain: "theuniversitypage-cc4a7.firebaseapp.com",
            projectId: "theuniversitypage-cc4a7",
            storageBucket: "theuniversitypage-cc4a7.firebasestorage.app",
            messagingSenderId: "31910615607",
            appId: "1:31910615607:web:bee5bd81c8118a16d1bdb2",
            measurementId: "G-6E55FCSXDP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const MASTER_PIN = "1009";

        window.verifyPin = function(e) {
            e.preventDefault();
            if(document.getElementById("pinInput").value.trim() === MASTER_PIN) {
                document.getElementById("authScreen").style.display = "none";
                sessionStorage.setItem("score_admin", "true");
                loadScores();
            } else {
                document.getElementById("pinError").style.display = "block";
            }
        };

        if(sessionStorage.getItem("score_admin") === "true") {
            document.getElementById("authScreen").style.display = "none";
            loadScores();
        }

        window.saveStudentScore = async function(e) {
            e.preventDefault();
            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.innerText = "Saving to Database...";

            try {
                await addDoc(collection(db, "student_scorecards"), {
                    fullName: document.getElementById("fullName").value.trim(),
                    rollNumber: document.getElementById("rollNumber").value.trim(),
                    universityName: document.getElementById("universityName").value.trim(),
                    targetCourse: document.getElementById("targetCourse").value.trim(),
                    rawScore: document.getElementById("rawScore").value.trim(),
                    normalizedScore: document.getElementById("normalizedScore").value.trim(),
                    percentile: document.getElementById("percentile").value.trim(),
                    admissionStatus: document.getElementById("admissionStatus").value.trim(),
                    createdAt: serverTimestamp()
                });

                alert("Scorecard saved successfully!");
                document.getElementById("scoreForm").reset();
                loadScores();
            } catch(err) {
                alert("Error saving: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Scorecard to Database";
            }
        };

        async function loadScores() {
            const tbody = document.getElementById("scoresTableBody");
            try {
                const querySnapshot = await getDocs(collection(db, "student_scorecards"));
                let html = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    html += `
                        <tr>
                            <td><strong>${data.rollNumber}</strong></td>
                            <td>${data.fullName}</td>
                            <td>${data.universityName}</td>
                            <td style="color:var(--primary); font-weight:800;">${data.normalizedScore}</td>
                            <td>${data.percentile}%</td>
                            <td><button class="btn-del" onclick="deleteRecord('${docSnap.id}')"><i class="fas fa-trash"></i></button></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html || `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--text-muted);">No student score records found.</td></tr>`;
            } catch(err) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#EF4444;">Error loading data: ${err.message}</td></tr>`;
            }
        }

        window.deleteRecord = async function(id) {
            if(confirm("Are you sure you want to delete this scorecard record?")) {
                try {
                    await deleteDoc(doc(db, "student_scorecards", id));
                    loadScores();
                } catch(err) {
                    alert("Delete error: " + err.message);
                }
            }
        }
    </script>
</body>
</html>
